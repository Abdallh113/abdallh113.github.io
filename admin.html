<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f1f5f7;color:#0b1b26;line-height:1.7}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 14px}
input,select,textarea,button{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #9fb3bd;background:#fff;color:inherit;border-radius:0}
button{background:#0b1b26;color:#fff;border:0;cursor:pointer;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:#fff;color:#0b1b26;border:1px solid #9fb3bd}.tabs button.on{background:#0b1b26;color:#fff}
.c{background:#fff;border:1px solid #cddad6;border-inline-start:5px solid #0b1b26;padding:12px 14px;margin-bottom:10px}
.c.n{border-inline-start-color:#e8791a}.c b{font-size:17px}.m{color:#4b5b66;font-size:13px}.d{white-space:pre-wrap;margin:6px 0}
.msg{padding:8px 12px;margin:5px 0;max-width:86%;white-space:pre-wrap}.msg.c1{background:#e8f1f7;margin-inline-end:auto}.msg.a1{background:#0b1b26;color:#fff;margin-inline-start:auto}
a{color:#0a58ca}.big{font-size:42px;font-weight:800;font-family:Arial}
</style></head><body><div class="w">
<div id="lg"><h1>تسجيل دخول الإدارة</h1><input id="em" type="email" placeholder="الإيميل" style="width:100%;margin-bottom:8px;direction:ltr"><input id="pw" type="password" placeholder="كلمة السر" style="width:100%;margin-bottom:8px;direction:ltr"><button id="in" style="width:100%">دخول</button><p id="er" style="color:#b00020"></p></div>
<div id="app" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h1>لوحة التحكم</h1><button id="out">خروج</button></div>
<div class="tabs"><button data-t="o" class="on">الطلبات</button><button data-t="t">التذاكر</button><button data-t="v">الزوار</button></div>
<div id="o"></div><div id="t" hidden></div><div id="v" hidden></div></div></div>
<script src="config.js"></script>
<script type="module">
var V="10.14.1",A=await import("https://www.gstatic.com/firebasejs/"+V+"/firebase-app.js"),F=await import("https://www.gstatic.com/firebasejs/"+V+"/firebase-firestore.js"),U=await import("https://www.gstatic.com/firebasejs/"+V+"/firebase-auth.js");
var app=A.initializeApp(window.FB_CONFIG),db=F.getFirestore(app),au=U.getAuth(app),$=function(i){return document.getElementById(i)},stop=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tm(x){return x&&x.toDate?x.toDate().toLocaleString("ar-EG"):""}
$("in").onclick=function(){U.signInWithEmailAndPassword(au,$("em").value.trim(),$("pw").value).catch(function(){$("er").textContent="بيانات الدخول غير صحيحة"})};
$("out").onclick=function(){U.signOut(au)};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x==b)});["o","t","v"].forEach(function(k){$(k).hidden=k!=b.dataset.t})}});
U.onAuthStateChanged(au,function(u){stop.forEach(function(f){f()});stop=[];$("lg").hidden=!!u;$("app").hidden=!u;if(!u)return;
 stop.push(F.onSnapshot(F.query(F.collection(db,"orders"),F.orderBy("createdAt","desc"),F.limit(100)),function(s){
  $("o").innerHTML=s.empty?"<p>ما في طلبات بعد.</p>":s.docs.map(function(d){var o=d.data(),ph=String(o.phone||"").replace(/\D/g,"");
   return'<div class="c '+(o.status=="new"?"n":"")+'"><b>'+esc(o.orderNo)+" · "+esc(o.service)+'</b><div class="m">'+tm(o.createdAt)+" · أرسل عبر: "+(o.via=="wa"?"واتساب":"ماسنجر")+'</div><div class="d">'+esc(o.details)+"\nالاسم: "+esc(o.name)+"\nالهاتف: "+esc(o.phone)+'</div><a target="_blank" href="https://wa.me/'+ph+'">راسله على واتساب</a> <select data-o="'+d.id+'"><option value="new"'+(o.status=="new"?" selected":"")+'>جديد</option><option value="doing"'+(o.status=="doing"?" selected":"")+'>قيد التنفيذ</option><option value="done"'+(o.status=="done"?" selected":"")+'>تم</option></select></div>'}).join("");
  $("o").querySelectorAll("select").forEach(function(x){x.onchange=function(){F.updateDoc(F.doc(db,"orders",x.dataset.o),{status:x.value})}})}));
 stop.push(F.onSnapshot(F.query(F.collection(db,"tickets"),F.orderBy("lastMsgAt","desc"),F.limit(100)),function(s){if(cur)return;
  $("t").innerHTML=(s.empty?"<p>ما في تذاكر بعد.</p>":"")+s.docs.map(function(d){var t=d.data();return'<div class="c '+(t.unread?"n":"")+'" data-k="'+d.id+'" style="cursor:pointer"><b>'+d.id+" · "+esc(t.name)+'</b><div class="m">'+esc(t.phone)+" · "+tm(t.lastMsgAt)+(t.unread?" · جديد":"")+'</div></div>'}).join("");
  $("t").querySelectorAll("[data-k]").forEach(function(c){c.onclick=function(){open(c.dataset.k)}})}));
 F.getDocs(F.query(F.collection(db,"stats"),F.orderBy("date","desc"),F.limit(14))).then(function(s){var r=s.docs.map(function(d){return d.data()});
  $("v").innerHTML='<div class="c"><div class="m">زوار اليوم</div><div class="big">'+(r[0]?r[0].count:0)+'</div></div>'+r.map(function(x){return'<div class="c"><b>'+esc(x.date)+"</b>: "+x.count+" زائر</div>"}).join("")})});
var un,cur;function open(id){cur=id;if(un)un();$("t").innerHTML='<p><a href="#" id="bk">رجوع</a></p><h1>تذكرة '+id+'</h1><div id="th"></div><textarea id="rp" style="width:100%" rows="3" placeholder="اكتب الرد"></textarea><button id="sd" style="width:100%;margin-top:6px">إرسال الرد</button>';
 $("bk").onclick=function(e){e.preventDefault();if(un)un();location.reload()};
 F.updateDoc(F.doc(db,"tickets",id),{unread:false});
 un=F.onSnapshot(F.query(F.collection(db,"tickets",id,"messages"),F.orderBy("createdAt")),function(s){$("th").innerHTML=s.docs.map(function(d){var m=d.data();return'<div class="msg '+(m.from=="admin"?"a1":"c1")+'">'+esc(m.text)+"</div>"}).join("")});
 $("sd").onclick=function(){var v=$("rp").value.trim();if(!v)return;$("rp").value="";F.addDoc(F.collection(db,"tickets",id,"messages"),{from:"admin",text:v,createdAt:F.serverTimestamp()}).then(function(){F.updateDoc(F.doc(db,"tickets",id),{lastMsgAt:F.serverTimestamp(),unread:false})})}}
</script></body></html>
